name: Keep Render awake

on:
  schedule:
    # Render free tier sleeps after 15 minutes without traffic.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 180 --retry 3 --retry-delay 10 --retry-all-errors "https://prompthub-hzvg.onrender.com/health" || true)
          echo "HTTP ${code}"
          if [ -z "$code" ] || [ "$code" = "000" ]; then
            exit 1
          fi
